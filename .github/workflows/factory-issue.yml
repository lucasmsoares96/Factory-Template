# A ready issue becomes a pull request, written with the repo owner's FACTORY_TOKEN (the Factory marks its texts with a hidden marker).
#   claim   (job token, issues: write, actions: write)  guard + lock: ready-for-agent -> in-progress, and factory:working
#           on the issue and its open PR; an issue without seams goes to agent:explore and the job dispatches
#           factory-triage.yml (a job-token label event starts no run)
#   image   the published Factory image of the default branch
#   work    (the image, read-only, Claude's auth only)  Development -> Review -> E2E; branch bundle, result.json, prints
#   publish (fresh VM, FACTORY_TOKEN, the harness of the default branch)  checks the forge again, pushes, opens the PR;
#           its last step takes factory:working off with the job token, whatever happened (if: always())
#   notify  (job token, issues: write)  the Merge Gate notice: a comment from github-actions[bot] that mentions who started the run
# The jobs meet only through the `work-out` artifact (git bundle + result.json + prints + stream-json). The agent never
# sees FACTORY_TOKEN. Off until `pnpm bootstrap factory` sets FACTORY_ENABLED; one run per issue at a time. A change to
# this file takes effect once it is on the default branch (`issues` events run the default branch's workflow).
name: Factory issue
# `#N` in the run's title is how the automatic Retro finds the runs of an issue, and how the end of another run sees
# this one is going (it keeps factory:working). A label event that `claim`'s condition skips (the Factory's own swaps
# included) names no issue, or every Escalation would leave the label behind until the next scan.
run-name: "${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == (vars.FACTORY_LABELS_READY_FOR_AGENT || 'ready-for-agent')) && format('#{0} {1}', github.event.issue.number || inputs.issue, github.event.issue.title || 'Factory issue') || 'Factory issue: another label' }}"

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue:
        description: Issue number
        type: string
        required: true

concurrency:
  group: factory-${{ github.event.issue.number || inputs.issue }}
  cancel-in-progress: false
  queue: max

permissions: {}

env:
  ISSUE: ${{ github.event.issue.number || inputs.issue }}
  FACTORY_ADAPTERS: github

jobs:
  claim:
    # Shown as skipped until FACTORY_ENABLED is true. A label event for any other label ends here.
    if: ${{ vars.FACTORY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.label.name == (vars.FACTORY_LABELS_READY_FOR_AGENT || 'ready-for-agent')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `pull-requests: write` puts factory:working on the issue's open PR.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    defaults:
      run:
        shell: bash
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
      start_sha: ${{ steps.claim.outputs.start_sha }}
      requester: ${{ steps.claim.outputs.requester }}
      pr: ${{ steps.claim.outputs.pr }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - id: claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_ACTION: ${{ github.event.action }}
        run: pnpm factory claim "$ISSUE" --event "$EVENT_ACTION"

  image:
    needs: claim
    if: ${{ needs.claim.outputs.claimed == 'true' }}
    uses: ./.github/workflows/factory-image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.repository.default_branch }}

  work:
    needs: [claim, image]
    if: ${{ needs.claim.outputs.claimed == 'true' }}
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    # `issues: read` is how `work` reads the issue (the job token cannot write anything).
    permissions:
      contents: read
      issues: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: ${{ vars.POSTGRES_IMAGE || 'postgres:18.6-alpine' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      # Full history, no blob filter: after the checkout nothing can authenticate to fetch a missing object.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      # The agent's HOME is the runner's, not the image's: link the shared pnpm and Playwright installs under it.
      - run: |
          mkdir -p "$HOME/.cache/node"
          ln -sfn /opt/corepack "$HOME/.cache/node/corepack"
          ln -sfn /ms-playwright "$HOME/.cache/ms-playwright"
          git config --global user.name "Factory"
          git config --global user.email "factory@users.noreply.github.com"
      - run: pnpm install --frozen-lockfile
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - name: work
        env:
          CI: "true"
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_SESSIONS_DIR: ${{ runner.temp }}/out/sessions
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # An empty secret is no credential: do not hand the agent an empty variable.
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          pnpm factory work "$ISSUE" --out "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-out
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [claim, image, work]
    # Also when `work` failed or timed out: with no result.json it escalates "infra". A run cancelled in `claim`, `image` or
    # `work` publishes nothing and only takes factory:working off.
    if: ${{ always() && needs.claim.outputs.claimed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # The job token writes only factory:working (last step), reads the runs it is kept for and, with `actions: write`,
    # dispatches the automatic Retro of an Escalation (FACTORY_TOKEN may not); FACTORY_TOKEN does the rest.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
      url: ${{ steps.publish.outputs.url }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: ${{ always() && needs.claim.result != 'cancelled' && needs.image.result != 'cancelled' }}
        continue-on-error: true
        with:
          name: work-out
          path: ${{ runner.temp }}/out
      # A `work` that timed out is `cancelled` too: it still publishes, so the issue escalates instead of staying silent.
      - name: publish
        id: publish
        if: ${{ always() && needs.claim.result != 'cancelled' && needs.image.result != 'cancelled' }}
        # GITHUB_TOKEN only puts factory:working on the PR this step opens and dispatches the Retro of an Escalation;
        # FACTORY_TOKEN does every other write.
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          START_SHA: ${{ needs.claim.outputs.start_sha }}
          WORK_RESULT: ${{ needs.work.result }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          gh --version | head -1
          pnpm factory publish "$ISSUE" --in "$RUNNER_TEMP/out" --start-sha "$START_SHA" --work-result "$WORK_RESULT"
      # The end of the run, whatever happened: never with FACTORY_TOKEN, whose label events would start workflows.
      - name: working off
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          MARKED_PR: ${{ needs.claim.outputs.pr }}
        run: pnpm factory working off "$ISSUE" ${MARKED_PR:+--pr "$MARKED_PR"}

  # The Merge Gate notice. The Factory writes as the owner, so GitHub notifies nobody of its comments; this one leaves
  # through the job's own GITHUB_TOKEN (github-actions[bot]), which fires no workflow, so it cannot start a loop.
  notify:
    needs: [claim, publish]
    if: ${{ always() && (needs.publish.outputs.outcome == 'ready' || needs.publish.outputs.outcome == 'escalated') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - name: notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.publish.outputs.outcome }}
          PR_URL: ${{ needs.publish.outputs.url }}
          REQUESTER: ${{ needs.claim.outputs.requester }}
        run: pnpm factory notify "$ISSUE" --outcome "$OUTCOME" --url "$PR_URL" --to "$REQUESTER"
