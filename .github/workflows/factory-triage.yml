# The Triage of issues labelled `agent:explore` (by someone with write access), in a batch.
#   image  the published Factory image of the default branch
#   work   (the image, read-only, Claude's auth only)  one Triage session over every issue in Triage -> triage.json
#   apply  (fresh VM, FACTORY_TOKEN, the harness of the default branch)  comment + label per verdict
# The agent never sees FACTORY_TOKEN; the jobs meet only through the `triage-out` artifact. One run at a time, and a
# label event that arrives while one runs replaces the pending run (no cancel of the running one): the next run reads
# every issue still in Triage, so nothing is lost. Off until `pnpm bootstrap factory` sets FACTORY_ENABLED. A change to
# this file takes effect once it is on the default branch.
name: Factory triage

on:
  issues:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: factory-triage
  cancel-in-progress: false

permissions: {}

env:
  FACTORY_ADAPTERS: github

jobs:
  image:
    # Skipped until FACTORY_ENABLED is true (then `work` and `apply` skip too). A label event for any other label ends here.
    if: ${{ vars.FACTORY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.label.name == (vars.FACTORY_LABELS_AGENT_EXPLORE || 'agent:explore')) }}
    uses: ./.github/workflows/factory-image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.repository.default_branch }}

  work:
    needs: image
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    # `issues: read` is how `triage` reads the issues (the job token cannot write anything).
    permissions:
      contents: read
      issues: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      # The agent's HOME is the runner's, not the image's: link the shared pnpm install under it.
      - run: |
          mkdir -p "$HOME/.cache/node"
          ln -sfn /opt/corepack "$HOME/.cache/node/corepack"
      - run: pnpm install --frozen-lockfile
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - name: triage
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_SESSIONS_DIR: ${{ runner.temp }}/out/sessions
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # An empty secret is no credential: do not hand the agent an empty variable.
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          pnpm factory triage --out "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-out
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore

  apply:
    needs: work
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-out
          path: ${{ runner.temp }}/out
      - name: apply
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
        run: pnpm factory apply --in "$RUNNER_TEMP/out"
