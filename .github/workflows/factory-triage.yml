# The Triage of issues labelled `agent:explore` (by someone with write access, or by the Factory's own swap of a writer's
# `ready-for-agent`, which dispatches this workflow), in a batch.
#   start  (job token, issues: write)  factory:working on each issue of the batch; hands the list to `done`
#   image  the published Factory image of the default branch
#   work   (the image, read-only, Claude's auth only)  one Triage session over every issue in Triage -> triage.json
#   apply  (fresh VM, FACTORY_TOKEN, the harness of the default branch)  comment + label per verdict
#   done   (job token, if: always())  takes factory:working off the batch, whatever happened
# The agent never sees FACTORY_TOKEN; the jobs meet only through the `triage-out` artifact. One run at a time, and a
# label event that arrives while one runs replaces the pending run (no cancel of the running one): the next run reads
# every issue still in Triage, so nothing is lost. Off until `pnpm bootstrap factory` sets FACTORY_ENABLED. A change to
# this file takes effect once it is on the default branch.
name: Factory triage
# Only a run `start`'s condition lets through is `Factory triage`: while one is queued or going, the issues still in
# Triage keep factory:working. Any other label event would keep them for a run that ends at once.
run-name: "${{ (github.event_name == 'workflow_dispatch' || github.event.label.name == (vars.FACTORY_LABELS_AGENT_EXPLORE || 'agent:explore')) && 'Factory triage' || 'Factory triage: another label' }}"

on:
  issues:
    types: [labeled]
  workflow_dispatch:

concurrency:
  group: factory-triage
  cancel-in-progress: false

permissions: {}

env:
  FACTORY_ADAPTERS: github

jobs:
  start:
    # Skipped until FACTORY_ENABLED is true (then every other job skips too). A label event for any other label ends here.
    if: ${{ vars.FACTORY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || github.event.label.name == (vars.FACTORY_LABELS_AGENT_EXPLORE || 'agent:explore')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The one write: factory:working on the issues of the batch, with the job token (its label event starts no workflow).
    permissions:
      contents: read
      issues: write
      pull-requests: write
    outputs:
      issues: ${{ steps.start.outputs.issues }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - id: start
        name: working on
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm factory working on --triage

  image:
    needs: start
    uses: ./.github/workflows/factory-image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.repository.default_branch }}

  work:
    needs: image
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 60
    # `issues: read` is how `triage` reads the issues (the job token cannot write anything).
    permissions:
      contents: read
      issues: read
      packages: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      # The agent's HOME is the runner's, not the image's: link the shared pnpm install under it.
      - run: |
          mkdir -p "$HOME/.cache/node"
          ln -sfn /opt/corepack "$HOME/.cache/node/corepack"
      - run: pnpm install --frozen-lockfile
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - name: triage
        env:
          CI: "true"
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_SESSIONS_DIR: ${{ runner.temp }}/out/sessions
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # An empty secret is no credential: do not hand the agent an empty variable.
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          pnpm factory triage --out "$RUNNER_TEMP/out"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: triage-out
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore

  apply:
    needs: work
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # `actions: write` is for the job token alone: it switches the resume sweep on when a Triage pauses (FACTORY_TOKEN cannot).
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: triage-out
          path: ${{ runner.temp }}/out
      - name: apply
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm factory apply --in "$RUNNER_TEMP/out"

  # The end of the run, whatever happened (a failed `work` skips `apply`): never with FACTORY_TOKEN.
  done:
    needs: [start, apply]
    if: ${{ always() && needs.start.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - name: working off
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ISSUES: ${{ needs.start.outputs.issues }}
        # ISSUES is the list of numbers `start` wrote: split on purpose.
        run: pnpm factory working off $ISSUES
