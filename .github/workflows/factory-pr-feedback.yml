# A human's comment on a Factory pull request becomes a round of answers and commits.
#   wait    debounce: a comment waits 180 s and a newer comment cancels the wait; a submitted review does not wait
#   claim   (job token)  filters (writer, factory/issue-N branch, open threads or Conversation requests; the Factory's own texts carry a hidden marker);
#           an accepted round puts factory:working on the PR and the issue, and 👀 on the comment or review that started it
#   notify  (job token, issues: write)  a comment from github-actions[bot] on the issue that mentions who commented
#   image / work / publish          as in factory-issue.yml, on the branch of the open PR: merge the base branch first,
#                                   Address / Decline / Defer / Answer per thread -> Development -> Review -> E2E -> prints;
#                                   publish's last step takes factory:working off with the job token (if: always())
# `factory-resume.yml` dispatches it (input `pr`) to start a round paused at the agent's usage limit again: the same
# claim, with no actor check (only writers and the job token may dispatch) and no wait.
# Never resolves a thread. The agent never sees FACTORY_TOKEN. Off until `pnpm bootstrap factory` sets FACTORY_ENABLED.
# `pull_request_review*` and `issue_comment` events run the default branch's workflow.
name: Factory PR feedback
# `PR #N` in the run's title is how a run is matched to its PR (the scan keeps factory:working while one is queued or going).
# An event `wait`'s cheap filter skips (the Factory's own marked texts, which every publish writes) names no PR, or
# the end of the run that wrote them would keep the label for a run that never takes it off.
run-name: "${{ (github.event_name == 'workflow_dispatch' || (!contains(github.event.comment.body, '<!-- factory -->') && !contains(github.event.review.body, '<!-- factory -->') && (github.event_name == 'issue_comment' && github.event.issue.pull_request || startsWith(github.event.pull_request.head.ref, 'factory/issue-')))) && format('PR #{0} feedback', github.event.pull_request.number || github.event.issue.number || inputs.pr) || 'Factory PR feedback: not for the Factory' }}"

on:
  pull_request_review:
    types: [submitted]
  pull_request_review_comment:
    types: [created]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number (the round `resume` starts again)
        type: string
        required: true

permissions: {}

env:
  PR: ${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
  FACTORY_ADAPTERS: github

jobs:
  wait:
    # Cheap filters only; the real ones (author permission, branch, open threads, the Factory marker) are `claim`'s, read from the forge.
    if: ${{ vars.FACTORY_ENABLED == 'true' && (github.event_name == 'workflow_dispatch' || (!contains(github.event.comment.body, '<!-- factory -->') && !contains(github.event.review.body, '<!-- factory -->') && (github.event_name == 'issue_comment' && github.event.issue.pull_request || startsWith(github.event.pull_request.head.ref, 'factory/issue-')))) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: factory-feedback-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr }}
      cancel-in-progress: true
    steps:
      - if: ${{ github.event_name != 'pull_request_review' && github.event_name != 'workflow_dispatch' }}
        run: sleep 180

  claim:
    needs: wait
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The writes: factory:working on the issue and the PR, and the 👀 reaction (issues: a Conversation comment;
    # pull-requests: a review comment or a review).
    permissions:
      contents: read
      issues: write
      pull-requests: write
    defaults:
      run:
        shell: bash
    outputs:
      claimed: ${{ steps.claim.outputs.claimed }}
      issue: ${{ steps.claim.outputs.issue }}
      pr: ${{ steps.claim.outputs.pr }}
      branch: ${{ steps.claim.outputs.branch }}
      start_sha: ${{ steps.claim.outputs.start_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - name: claim
        id: claim
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_ID: ${{ github.event.comment.id || github.event.review.id }}
        run: pnpm factory pr-feedback --pr "$PR" --actor "$ACTOR" --event "$EVENT_NAME" --comment-id "$COMMENT_ID"

  image:
    needs: claim
    if: ${{ needs.claim.outputs.claimed == 'true' }}
    uses: ./.github/workflows/factory-image.yml
    permissions:
      contents: read
      packages: write
    with:
      ref: ${{ github.event.repository.default_branch }}

  work:
    needs: [claim, image]
    if: ${{ needs.claim.outputs.claimed == 'true' }}
    runs-on: ${{ vars.FACTORY_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 350
    env:
      ISSUE: ${{ needs.claim.outputs.issue }}
      PR: ${{ needs.claim.outputs.pr }}
    # The same group as the issue flow: one run per issue at a time. The guarantee is the lease of `publish`.
    concurrency:
      group: factory-${{ needs.claim.outputs.issue }}
      cancel-in-progress: false
      queue: max
    # `issues: read` is how `work` reads the issue (the job token cannot write anything).
    # `actions: read` lets it read the failed jobs of the PR's head and their logs for the Development prompt.
    permissions:
      contents: read
      issues: read
      pull-requests: read
      packages: read
      actions: read
    container:
      image: ${{ needs.image.outputs.image }}
      credentials:
        username: ${{ github.actor }}
        password: ${{ github.token }}
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: ${{ vars.POSTGRES_IMAGE || 'postgres:18.6-alpine' }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    steps:
      # Full history, no blob filter: after the checkout nothing can authenticate to fetch a missing object.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      # The branch the run continues, fetched with the read-only job token (held by this step alone, never on disk).
      - env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ needs.claim.outputs.branch }}
        run: |
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.https://github.com/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          git fetch --no-tags origin "+refs/heads/$BRANCH:refs/heads/$BRANCH"
      # The agent's HOME is the runner's, not the image's: link the shared pnpm and Playwright installs under it.
      - run: |
          mkdir -p "$HOME/.cache/node"
          ln -sfn /opt/corepack "$HOME/.cache/node/corepack"
          ln -sfn /ms-playwright "$HOME/.cache/ms-playwright"
          git config --global user.name "Factory"
          git config --global user.email "factory@users.noreply.github.com"
      - run: pnpm install --frozen-lockfile
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - name: work
        env:
          CI: "true"
          DATABASE_URL: postgres://postgres:postgres@postgres:5432/postgres
          GITHUB_TOKEN: ${{ github.token }}
          FACTORY_SESSIONS_DIR: ${{ runner.temp }}/out/sessions
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          # An empty secret is no credential: do not hand the agent an empty variable.
          [ -n "$CLAUDE_CODE_OAUTH_TOKEN" ] || unset CLAUDE_CODE_OAUTH_TOKEN
          [ -n "$ANTHROPIC_API_KEY" ] || unset ANTHROPIC_API_KEY
          pnpm factory work "$ISSUE" --flow pr-feedback --pr "$PR" --out "$RUNNER_TEMP/out"
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: work-out
          path: ${{ runner.temp }}/out
          retention-days: 14
          if-no-files-found: ignore

  publish:
    needs: [claim, work]
    # Also when `work` failed, timed out or was cancelled: with no result.json it escalates "infra".
    if: ${{ always() && needs.claim.outputs.claimed == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ISSUE: ${{ needs.claim.outputs.issue }}
      PR: ${{ needs.claim.outputs.pr }}
    # The job token writes only factory:working (last step), reads the runs it is kept for and, with `actions: write`,
    # dispatches the automatic Retro of an Escalation (FACTORY_TOKEN may not); FACTORY_TOKEN does the rest.
    permissions:
      contents: read
      issues: write
      pull-requests: write
      actions: write
    outputs:
      outcome: ${{ steps.publish.outputs.outcome }}
      url: ${{ steps.publish.outputs.url }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        continue-on-error: true
        with:
          name: work-out
          path: ${{ runner.temp }}/out
      - name: publish
        id: publish
        # GITHUB_TOKEN only dispatches the Retro of an Escalation; FACTORY_TOKEN does every write.
        env:
          FACTORY_TOKEN: ${{ secrets.FACTORY_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          START_SHA: ${{ needs.claim.outputs.start_sha }}
          PR: ${{ needs.claim.outputs.pr }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          gh --version | head -1
          pnpm factory publish "$ISSUE" --in "$RUNNER_TEMP/out" --pr "$PR" --start-sha "$START_SHA"
      # The end of the run, whatever happened: never with FACTORY_TOKEN, whose label events would start workflows.
      - name: working off
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm factory working off "$ISSUE" --pr "$PR"

  # The Merge Gate notice. The Factory writes as the owner, so GitHub notifies nobody of its comments; this one leaves
  # through the job's own GITHUB_TOKEN (github-actions[bot]), which fires no workflow, so it cannot start a loop.
  notify:
    needs: [claim, publish]
    if: ${{ always() && (needs.publish.outputs.outcome == 'ready' || needs.publish.outputs.outcome == 'escalated') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ISSUE: ${{ needs.claim.outputs.issue }}
    permissions:
      contents: read
      issues: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - env:
          VARS_JSON: ${{ toJSON(vars) }}
        run: node .factory/src/ci/vars.ts
      - name: notify
        env:
          GITHUB_TOKEN: ${{ github.token }}
          OUTCOME: ${{ needs.publish.outputs.outcome }}
          PR_URL: ${{ needs.publish.outputs.url }}
          REQUESTER: ${{ github.actor }}
        run: pnpm factory notify "$ISSUE" --outcome "$OUTCOME" --updated --url "$PR_URL" --to "$REQUESTER"
