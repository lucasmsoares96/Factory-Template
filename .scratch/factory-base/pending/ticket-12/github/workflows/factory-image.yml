# The Factory image: ubuntu:24.04 + .factory/image/setup.sh, in GHCR. The tag is
# a hash of the versions, the Dockerfile and setup.sh (.factory/src/ci/image.ts).
# Checks the tag in the registry and builds and publishes only when it is missing.
# Used by the PR workflow (`build`, `ci-probe`) and by the `work` job.
name: Factory image

on:
  workflow_call:
    inputs:
      ref:
        description: "The commit whose versions, Dockerfile and setup.sh decide the tag (empty: the caller commit)."
        type: string
        required: false
        default: ""
    outputs:
      image:
        description: The full reference of the image, name:tag.
        value: ${{ jobs.image.outputs.ref }}

permissions: {}

jobs:
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        shell: bash
    outputs:
      ref: ${{ steps.hash.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
          filter: blob:none
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # The hash reads the config (zod), so the harness package is installed.
      - run: corepack enable pnpm && pnpm install --frozen-lockfile --ignore-scripts --filter @factory/harness
      - id: hash
        run: node .factory/src/ci/image.ts
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: registry
        env:
          IMAGE: ${{ steps.hash.outputs.ref }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$IMAGE is already published." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.registry.outputs.exists == 'false'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - if: steps.registry.outputs.exists == 'false'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .factory/image
          platforms: linux/amd64
          build-args: ${{ steps.hash.outputs.build_args }}
          tags: ${{ steps.hash.outputs.ref }}
          # Links the package to this repository: it inherits the repository's access.
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          push: true
