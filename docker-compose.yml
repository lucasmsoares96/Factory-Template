# Local Postgres for `pnpm dev`, tests and `pnpm factory:verify`.
# The compose project name defaults to the directory name, so sibling
# worktrees never share a container. The host port is random unless
# POSTGRES_PORT is set; read it with `docker compose port postgres 5432`.
# Set POSTGRES_IMAGE to a GHCR mirror to avoid Docker Hub pull limits.
services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:18.6-alpine}
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-}:5432"
    tmpfs:
      - /var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 1s
      timeout: 3s
      retries: 30
