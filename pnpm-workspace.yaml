packages:
  - apps/*
  - packages/*
  - .factory

# Stack versions, pinned exactly. Each one was checked against the npm registry
# and the official docs on the date recorded in the ticket that added it.
catalog:
  # Tooling
  "@clack/prompts": 1.8.1
  neonctl: 8.8.0
  "@types/node": 24.19.2
  oxlint: 1.88.0
  turbo: 2.11.9
  typescript: 7.0.2
  vitest: 5.0.5
  # Cloudflare Workers
  "@cloudflare/vite-plugin": 1.64.0
  wrangler: 4.151.2
  # Front
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  "@vitejs/plugin-react": 6.1.2
  react: 19.3.1
  react-dom: 19.3.1
  vite: 8.3.4
  "@tanstack/react-form": 1.33.5
  "@tanstack/react-query": 5.104.4
  "@tanstack/react-router": 1.170.45
  "@tanstack/router-generator": 1.167.45
  "@tanstack/router-plugin": 1.168.47
  "@tanstack/virtual-file-routes": 1.162.0
  # UI: shadcn (Base UI) + Tailwind
  "@base-ui/react": 1.9.0
  "@fontsource-variable/geist": 5.3.0
  "@tailwindcss/vite": 4.3.3
  class-variance-authority: 0.7.1
  cn: 0.5.0
  lucide-react: 1.59.0
  shadcn: 4.22.1
  tailwindcss: 4.3.3
  tw-animate-css: 1.4.0
  # API
  "@hono/swagger-ui": 0.6.1
  "@hono/zod-openapi": 1.6.3
  hono: 4.13.13
  zod: 4.6.7
  # Auth and email
  better-auth: 1.7.11
  # MCP: OAuth authorization server + stateless MCP handler (SDK v2)
  "@cloudflare/workers-oauth-provider": 1.2.3
  "@modelcontextprotocol/client": 2.3.1
  "@modelcontextprotocol/sdk": 1.32.1
  "@modelcontextprotocol/server": 2.3.1
  agents: 0.28.1
  react-email: 6.11.3
  resend: 6.34.1
  # Contract → client (Kubb 5: adapter-oas replaces v4's plugin-oas)
  "@faker-js/faker": 10.6.0
  "@kubb/adapter-oas": 5.11.1
  "@kubb/plugin-faker": 5.1.9
  "@kubb/plugin-fetch": 5.7.0
  "@kubb/plugin-msw": 5.1.3
  "@kubb/plugin-react-query": 5.5.3
  "@kubb/plugin-ts": 5.0.14
  "@kubb/plugin-zod": 5.4.12
  kubb: 5.11.1
  # Tests
  "@playwright/test": 1.64.1
  "@vitest/browser-playwright": 5.0.5
  msw: 3.0.3
  playwright: 1.64.1
  vitest-browser-react: 2.3.0
  # Database
  "@types/pg": 8.23.1
  drizzle-kit: 1.0.0-rc.4
  drizzle-orm: 1.0.0-rc.4
  pg: 8.23.1
  # Factory: coding-agent runner (pre-1.0, pinned exactly)
  "@ai-hero/sandcastle": 0.12.0

catalogMode: strict

# @kubb/plugin-msw 5.1.3 still declares `msw ^2` (kubb-labs/plugins#1049, open on
# 2026-10-19). Its generated handlers only import `http` and `HttpResponseResolver`
# from the `msw` root, which MSW 3 keeps until v4. The Kubb gate in the Skeleton
# (generate + tsc + a Browser Mode test overriding a generated handler) catches a break.
peerDependencyRules:
  allowedVersions:
    "@kubb/plugin-msw>msw": "3"

# pnpm 12 refuses releases younger than a day (minimumReleaseAge). wrangler 4.151.2
# and its workerd were published on 2026-10-19; drop these once they are a day old.
minimumReleaseAgeExclude:
  - "@cloudflare/workerd-darwin-64@1.20261019.1"
  - "@cloudflare/workerd-darwin-arm64@1.20261019.1"
  - "@cloudflare/workerd-linux-64@1.20261019.1"
  - "@cloudflare/workerd-linux-arm64@1.20261019.1"
  - "@cloudflare/workerd-windows-64@1.20261019.1"
  - miniflare@5.20261019.0-beta
  - workerd@1.20261019.1
  - wrangler@4.151.2
  - "@kubb/adapter-oas@5.11.1"
  - "@kubb/ast@5.11.1"
  - "@kubb/cli@5.11.1"
  - "@kubb/core@5.11.1"
  - "@kubb/kit@5.11.1"
  - "@kubb/mcp@5.11.1"
  - "@kubb/parser-md@5.11.1"
  - "@kubb/parser-ts@5.11.1"
  - "@kubb/plugin-barrel@5.11.1"
  - "@kubb/renderer-jsx@5.11.1"
  - "@kubb/studio@5.11.1"
  - kubb@5.11.1
  - shadcn@4.22.1
  - unplugin-kubb@5.11.1
  - "@better-auth/core@1.7.11"
  - "@better-auth/drizzle-adapter@1.7.11"
  - "@better-auth/kysely-adapter@1.7.11"
  - "@better-auth/memory-adapter@1.7.11"
  - "@better-auth/mongo-adapter@1.7.11"
  - "@better-auth/prisma-adapter@1.7.11"
  - "@better-auth/telemetry@1.7.11"
  - better-auth@1.7.11

# Dependencies allowed to run install scripts (pnpm fails on any other).
allowBuilds:
  esbuild: true
  workerd: true
  # Pulled in by agents (mimetext → @babel/runtime-corejs3); its postinstall only prints a banner.
  core-js-pure: false
